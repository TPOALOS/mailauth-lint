[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailauth-lint"
version = "1.0.0"
description = "Offline linter for SPF, DMARC and DKIM DNS record text: lookup limits, weak policies, short keys. No DNS lookups, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["spf", "dmarc", "dkim", "email-security", "dns", "linter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/mailauth-lint"

[project.scripts]
mailauth-lint = "mailauth_lint:main"

[tool.setuptools]
py-modules = ["mailauth_lint"]
